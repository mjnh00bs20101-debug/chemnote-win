name: Build Windows EXE (ChemNote)

on:
  workflow_dispatch:
  push:
    paths:
      - 'Chemnote_Windows_Electron/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Chemnote_Windows_Electron

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read app version
        id: pkg
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Electron dependencies
        run: npm install

      - name: Build Windows Installer & Portable EXE
        run: npm run dist:win

      - name: Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChemNote-Windows-x64
          path: |
            Chemnote_Windows_Electron/dist/*.exe
            Chemnote_Windows_Electron/dist/*.blockmap
            Chemnote_Windows_Electron/dist/latest.yml
          if-no-files-found: error

      - name: Publish GitHub Release (for Auto-Update)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: ChemNote v${{ steps.pkg.outputs.version }}
          generate_release_notes: true
          files: |
            Chemnote_Windows_Electron/dist/*.exe
            Chemnote_Windows_Electron/dist/*.blockmap
            Chemnote_Windows_Electron/dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
